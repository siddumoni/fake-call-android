name: Generate and verify Gradle wrapper

on:
  push:
    branches: [initial-setup]

permissions:
  contents: write

concurrency:
  group: wrapper-bootstrap-initial-setup
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted project branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: initial-setup
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 9.7.0
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
        with:
          gradle-version: '9.7.0'
      - name: Generate official wrapper with distribution checksum
        run: |
          gradle wrapper \
            --gradle-version 9.7.0 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum 84fbba45c7f4c64abc77460e1c00f541e9f960e3c7ed2538f1ede19eacd873ae
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android 17 preview platform and Build Tools
        run: python3 scripts/install_android_sdk.py --kind=compile
      - name: Generate dependency verification metadata and locks from the real build
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            --write-verification-metadata sha256 --write-locks \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:compileDebugAndroidTestKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:ktlintCheck \
            :app:processDebugMainManifest
      - name: Run strict build, unit tests and lint
        run: |
          ./gradlew --no-daemon --no-configuration-cache --dependency-verification strict \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:ktlintCheck \
            :app:processDebugMainManifest
          python3 scripts/check_merged_manifest.py
          bash scripts/check_ui_colors.sh
      - name: Commit wrapper and dependency integrity files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wrapper and dependency verification files are already current."
            exit 0
          fi
          git commit -m "build: add verified Gradle wrapper and dependency checksums"
          git push origin HEAD:initial-setup
