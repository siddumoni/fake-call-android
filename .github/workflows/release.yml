name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed APK when secrets exist
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ALIBICALL_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ALIBICALL_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIBICALL_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ALIBICALL_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/alibicall-release.jks"
            echo "ALIBICALL_SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "ALIBICALL_KEYSTORE_PATH=$RUNNER_TEMP/alibicall-release.jks" >> "$GITHUB_ENV"
          else
            echo "ALIBICALL_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        run: |
          if [ "$ALIBICALL_SIGNING_READY" = "true" ]; then
            ./gradlew --no-daemon :app:assembleRelease               -Pandroid.injected.signing.store.file="$ALIBICALL_KEYSTORE_PATH"               -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD"               -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS"               -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"
          else
            ./gradlew --no-daemon :app:assembleDebug
          fi
      - name: Prepare release files and checksum
        run: |
          mkdir -p release
          if [ "$ALIBICALL_SIGNING_READY" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk release/AlibiCall-release.apk
          else
            cp app/build/outputs/apk/debug/*.apk release/AlibiCall-DEBUG-UNSIGNED.apk
          fi
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.1
        with:
          files: release/*
          generate_release_notes: true
