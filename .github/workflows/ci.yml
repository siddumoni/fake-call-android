name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and unit tests (API 36)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform 37 and emulator
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Gradle dependency verification
        run: ./gradlew --write-verification-metadata sha256 help
      - name: Verify no unexpected Android permissions
        run: ./gradlew :app:processDebugMainManifest
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload debug APK (unsigned debug build)
        uses: actions/upload-artifact@ea0be95b9ac956f2d6d3d5c0a0a6e6b7d9d1b7b6 # v4.6.2
        if: success()
        with:
          name: alibicall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Instrumented tests (API 36)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install API 36 emulator
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
      - name: Start emulator and run instrumented tests
        uses: reactivecircus/android-emulator-runner@1d8c1f2e1e3b0efb09e2b0f0d3f4c1aa5e0d9f87
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

  static-analysis:
    name: Static analysis and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: CodeQL init
        uses: github/codeql-action/init@5f8171a6e8e17a0b0f9a1c08c7bb8d3c2a8dcb64 # v3.28.17
        with:
          languages: java-kotlin
      - name: Autobuild
        uses: github/codeql-action/autobuild@5f8171a6e8e17a0b0f9a1c08c7bb8d3c2a8dcb64 # v3.28.17
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@5f8171a6e8e17a0b0f9a1c08c7bb8d3c2a8dcb64 # v3.28.17

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@5a2ce3f5b6d03a96e4f7f8f4f9f9f7c8c8f2c2ad # v4.3.5
        with:
          fail-on-severity: moderate

  formatting:
    name: Kotlin formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Check formatting
        run: ./gradlew --no-daemon ktlintCheck
