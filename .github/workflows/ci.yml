name: Android CI

on:
  pull_request:
    branches: [main, initial-setup]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, unit tests, lint and manifest policy (API 37)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle with a clean dependency cache
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
        with:
          cache-disabled: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Test Android SDK installer selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install Android 17 preview platform and Build Tools
        run: python3 scripts/install_android_sdk.py --kind=compile
      - name: Build and verify
        run: |
          ./gradlew --no-daemon --dependency-verification strict \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:compileDebugAndroidTestKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:ktlintCheck \
            :app:processDebugMainManifest
      - name: Check merged-manifest permission allowlist
        run: python3 scripts/check_merged_manifest.py
      - name: Enforce central UI color tokens
        run: bash scripts/check_ui_colors.sh
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: alibicall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Instrumented and screenshot tests (API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install latest available Android emulator image
        run: python3 scripts/install_android_sdk.py --kind=emulator
      - name: Enable KVM access or select software-emulation fallback
        run: |
          if [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is readable and writable; the emulator runner can use hardware acceleration."
          else
            echo "KVM is unavailable; the emulator runner will use TCG software emulation."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi
      - name: Start emulator and run instrumented / screenshot tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ env.ANDROID_EMULATOR_SYSTEM_IMAGE_API_LEVEL }}
          system-image-api-level: ${{ env.ANDROID_EMULATOR_SYSTEM_IMAGE_API_LEVEL }}
          target: ${{ env.ANDROID_EMULATOR_TARGET }}
          arch: ${{ env.ANDROID_EMULATOR_ARCH }}
          profile: pixel_2
          avd-name: alibicall-ci
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          channel: canary
          script: |
            echo "Android emulator API: $ANDROID_EMULATOR_API_LEVEL" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "System image: $ANDROID_EMULATOR_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
            ./gradlew --no-daemon --dependency-verification strict :app:connectedDebugAndroidTest


  codeql:
    name: CodeQL (Kotlin and Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle with a clean dependency cache
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
        with:
          cache-disabled: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android 17 preview platform and Build Tools
        run: python3 scripts/install_android_sdk.py --kind=compile
      - name: Build Kotlin sources for CodeQL
        run: ./gradlew --no-daemon --dependency-verification strict :app:assembleDebug
      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8
        with:
          fail-on-severity: moderate
