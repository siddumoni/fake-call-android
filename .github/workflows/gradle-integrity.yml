name: Refresh Gradle integrity metadata

on:
  push:
    branches:
      - initial-setup
    paths:
      - '.github/workflows/gradle-integrity.yml'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'build-logic/**'
      - 'scripts/install_android_sdk.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gradle-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate dependency locks and checksums
    if: github.ref == 'refs/heads/initial-setup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android 17 compile SDK
        run: python3 scripts/install_android_sdk.py --kind=compile
      - name: Remove stale app dependency lock before regenerating the resolved lock graph
        run: rm -f app/gradle.lockfile
      - name: Resolve dependencies and regenerate verification metadata / locks
        run: |
          ./gradlew --no-daemon --refresh-dependencies \
            --write-verification-metadata sha256 \
            --write-locks \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:lintDebug
      - name: Commit updated dependency integrity files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml app/gradle.lockfile settings-gradle.lockfile
          if git diff --cached --quiet; then
            echo "Dependency integrity files are already current."
          else
            git commit -m "build: refresh Gradle dependency integrity metadata"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
