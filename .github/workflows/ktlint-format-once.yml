name: One-time ktlint formatting

on:
  push:
    branches:
      - pr3-caller-presets-v2
    paths:
      - '.github/workflows/ktlint-format-once.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: pr3-caller-presets-v2
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install compile platform
        run: python3 scripts/install_android_sdk.py --kind=compile
      - name: Format and verify latest Kotlin sources with pinned KtLint
        run: |
          ./gradlew --no-daemon :app:ktlintFormat
          ./gradlew --no-daemon :app:ktlintCheck
      - name: Commit formatted sources and remove one-time formatter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          git rm .github/workflows/ktlint-format-once.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "style: format caller profile and preview feature with ktlint"
          git push origin HEAD:pr3-caller-presets-v2
